<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte — Recipe Guide</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&display=swap');

:root{
  --ink:#1c1814;
  --ink-soft:#3c352d;
  --paper:#f3ede1;
  --card:#fffdf8;
  --burgundy:#7a2331;
  --burgundy-dark:#5c1a24;
  --brass:#a9834f;
  --brass-light:#cbab77;
  --stone:#8a8172;
  --line:#ddd2bd;
  --line-soft:#e9e1d1;
  --danger:#7a2331;
  --radius:2px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Source Serif 4', Georgia, 'Iowan Old Style', serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:'Fraunces', Georgia, serif;
  font-weight:600;
  letter-spacing:-0.01em;
  color:var(--ink);
  margin:0;
}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--brass-light); color:var(--ink);}
:focus-visible{outline:2px solid var(--burgundy); outline-offset:2px;}

.eyebrow{
  font-size:11.5px;
  letter-spacing:0.11em;
  text-transform:uppercase;
  color:var(--brass);
  font-weight:600;
}

/* ---------- App shell ---------- */
.app{
  display:flex;
  min-height:100vh;
  max-width:1180px;
  margin:0 auto;
}
.sidebar{
  width:250px;
  flex-shrink:0;
  border-right:1px solid var(--line);
  padding:28px 22px 22px;
  position:sticky;
  top:0;
  align-self:flex-start;
  height:100vh;
  overflow-y:auto;
}
.wordmark{
  display:flex;
  align-items:baseline;
  gap:8px;
  margin-bottom:2px;
}
.wordmark .mark{
  font-size:26px;
  font-weight:600;
  font-style:italic;
}
.wordmark .sub{
  font-size:10.5px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--stone);
}
.sidebar-rule{
  height:1px;
  background:linear-gradient(to right, var(--brass), var(--line) 60%);
  margin:16px 0 20px;
}
.search-box{
  width:100%;
  border:1px solid var(--line);
  background:var(--card);
  padding:9px 11px;
  font-family:'Source Serif 4', serif;
  font-size:13.5px;
  color:var(--ink);
  border-radius:var(--radius);
  margin-bottom:18px;
}
.search-box:focus{border-color:var(--burgundy);}
.new-recipe-btn{
  width:100%;
  background:var(--burgundy);
  color:#fdf8ef;
  border:none;
  padding:10px 12px;
  font-size:13px;
  letter-spacing:0.04em;
  cursor:pointer;
  border-radius:var(--radius);
  margin-bottom:24px;
  transition:background .15s ease;
  font-family:'Source Serif 4', serif;
}
.new-recipe-btn:hover{background:var(--burgundy-dark);}

.cat-list{list-style:none;margin:0;padding:0;}
.cat-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:7px 8px;
  cursor:pointer;
  border-radius:var(--radius);
  font-size:13.5px;
  color:var(--ink-soft);
  margin-bottom:2px;
}
.cat-item:hover{background:var(--line-soft);}
.cat-item.active{background:var(--burgundy); color:#fdf8ef;}
.cat-item.active .cat-count{color:#f0d9c8;}
.cat-count{font-size:11.5px; color:var(--stone);}
.cat-right{display:flex; align-items:center; gap:7px; flex-shrink:0;}
.cat-icon-btn{
  background:none;
  border:none;
  color:var(--stone);
  opacity:0.65;
  cursor:pointer;
  font-size:11.5px;
  line-height:1;
  padding:2px;
}
.cat-icon-btn:hover{opacity:1; color:var(--burgundy);}
.cat-item.active .cat-icon-btn{color:#f0d9c8;}
.cat-item.active .cat-icon-btn:hover{color:#fff;}
.cat-label{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

.add-cat-row{
  display:flex;
  gap:6px;
  margin-top:14px;
}
.add-cat-row input{
  flex:1;
  border:none;
  border-bottom:1px solid var(--line);
  background:transparent;
  padding:6px 2px;
  font-size:12.5px;
  font-family:'Source Serif 4', serif;
  color:var(--ink);
}
.add-cat-row input:focus{border-color:var(--burgundy);}
.add-cat-row button{
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink-soft);
  font-size:16px;
  line-height:1;
  width:28px;
  cursor:pointer;
  border-radius:var(--radius);
}
.add-cat-row button:hover{border-color:var(--burgundy); color:var(--burgundy);}

.sidebar-footer{
  margin-top:28px;
  padding-top:16px;
  border-top:1px solid var(--line);
  display:flex;
  flex-direction:column;
  gap:8px;
}
.ghost-btn{
  background:none;
  border:1px solid var(--line);
  color:var(--ink-soft);
  font-size:12px;
  padding:7px 10px;
  cursor:pointer;
  border-radius:var(--radius);
  font-family:'Source Serif 4', serif;
  text-align:left;
}
.ghost-btn:hover{border-color:var(--burgundy); color:var(--burgundy);}
.storage-note{
  font-size:11px;
  color:var(--stone);
  line-height:1.5;
  margin-top:4px;
}

/* ---------- Main ---------- */
.main{
  flex:1;
  min-width:0;
  padding:32px 44px 80px;
}
.main-header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom:26px;
  gap:16px;
}
.main-title{font-size:26px;}
.recipe-count{font-size:12.5px; color:var(--stone);}

.section-block + .section-block{margin-top:38px;}
.section-heading{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:16px;
}
.section-heading .eyebrow{font-size:12px;}
.section-heading .rule{flex:1; height:1px; background:var(--line);}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
  gap:16px;
}
.rcard{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px 18px 16px;
  cursor:pointer;
  transition:border-color .15s ease;
  display:flex;
  flex-direction:column;
  min-height:140px;
}
.rcard:hover{border-color:var(--burgundy);}
.rcard-photo{
  width:calc(100% + 36px);
  margin:-18px -18px 14px;
  aspect-ratio:4/3;
  object-fit:cover;
  display:block;
}
.rcard .eyebrow{margin-bottom:8px;}
.rcard h3{font-size:18px; line-height:1.25; margin-bottom:8px;}
.rcard .desc{
  font-size:12.5px;
  color:var(--ink-soft);
  font-style:italic;
  flex:1;
  margin-bottom:10px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.rcard .meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:var(--stone);
  border-top:1px solid var(--line-soft);
  padding-top:10px;
}
.stars{color:var(--brass); letter-spacing:1px;}

.empty-state{
  text-align:center;
  padding:70px 20px;
  color:var(--stone);
}
.empty-state .display{font-size:22px; margin-bottom:8px; color:var(--ink-soft);}
.empty-state p{font-size:13.5px; max-width:360px; margin:0 auto;}

/* ---------- Recipe detail (printable card) ---------- */
.card-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
  flex-wrap:wrap;
  gap:10px;
}
.back-link{
  background:none;
  border:none;
  color:var(--stone);
  font-size:12.5px;
  cursor:pointer;
  padding:0;
  font-family:'Source Serif 4', serif;
}
.back-link:hover{color:var(--burgundy);}
.toolbar-actions{display:flex; gap:8px; flex-wrap:wrap;}
.tbtn{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink-soft);
  font-size:12px;
  padding:7px 12px;
  cursor:pointer;
  border-radius:var(--radius);
  font-family:'Source Serif 4', serif;
}
.tbtn:hover{border-color:var(--burgundy); color:var(--burgundy);}
.tbtn.primary{background:var(--burgundy); color:#fdf8ef; border-color:var(--burgundy);}
.tbtn.primary:hover{background:var(--burgundy-dark);}
.tbtn.danger:hover{border-color:var(--danger); color:var(--danger);}

.recipe-card{
  background:var(--card);
  border:1px solid var(--line);
  padding:52px 56px;
  max-width:760px;
}
.rc-photo{
  width:100%;
  aspect-ratio:16/10;
  object-fit:cover;
  border:1px solid var(--line);
  margin-bottom:30px;
}
.rc-head{text-align:center; margin-bottom:26px;}
.rc-head .eyebrow{justify-content:center; display:flex; gap:10px; align-items:center; margin-bottom:14px;}
.rc-head .dot{color:var(--line);}
.rc-head h1{font-size:34px; line-height:1.15; margin-bottom:10px;}
.rc-head .rc-desc{
  font-style:italic;
  color:var(--ink-soft);
  font-size:15px;
  max-width:520px;
  margin:0 auto;
}
.rc-meta{
  display:flex;
  justify-content:center;
  gap:26px;
  margin-top:18px;
  font-size:12px;
  color:var(--stone);
  letter-spacing:0.03em;
}
.rc-meta b{color:var(--ink-soft); font-weight:600;}
.rc-rule{
  height:1px;
  background:var(--line);
  margin:28px 0;
  position:relative;
}
.rc-rule::after{
  content:"❧";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:var(--card);
  padding:0 12px;
  color:var(--brass);
  font-size:14px;
}
.rc-body{
  display:grid;
  grid-template-columns:1fr 1.6fr;
  gap:40px;
}
.rc-col h2{
  font-size:12px;
  letter-spacing:0.11em;
  text-transform:uppercase;
  color:var(--burgundy);
  font-family:'Source Serif 4', serif;
  font-weight:600;
  margin-bottom:14px;
}
.ing-list{list-style:none; margin:0; padding:0;}
.ing-list li{
  font-size:13.5px;
  color:var(--ink-soft);
  padding:6px 0;
  border-bottom:1px dotted var(--line);
}
.ing-list li:last-child{border-bottom:none;}
.step-list{list-style:none; margin:0; padding:0; counter-reset:step;}
.step-list li{
  counter-increment:step;
  display:flex;
  gap:14px;
  padding:12px 0;
  border-bottom:1px solid var(--line-soft);
}
.step-list li:last-child{border-bottom:none;}
.step-list li::before{
  content:counter(step);
  font-family:'Fraunces', serif;
  font-style:italic;
  font-size:16px;
  color:var(--brass);
  flex-shrink:0;
  width:20px;
}
.step-content{flex:1; min-width:0; display:flex; flex-direction:column; gap:10px;}
.step-text{font-size:13.5px; color:var(--ink-soft);}
.step-photo{
  width:100%;
  max-width:320px;
  aspect-ratio:4/3;
  object-fit:cover;
  border:1px solid var(--line);
}
.rc-notes{
  margin-top:30px;
  padding-top:20px;
  border-top:1px solid var(--line);
  font-size:13px;
  font-style:italic;
  color:var(--stone);
  text-align:center;
}
.rc-tags{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:18px;
  flex-wrap:wrap;
}
.tag-pill{
  border:1px solid var(--brass-light);
  color:var(--brass);
  font-size:10.5px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  padding:4px 10px;
  border-radius:20px;
}

/* ---------- Edit form ---------- */
.form-wrap{max-width:720px;}
.field{margin-bottom:20px;}
.field label{
  display:block;
  font-size:11.5px;
  letter-spacing:0.09em;
  text-transform:uppercase;
  color:var(--brass);
  font-weight:600;
  margin-bottom:7px;
}
.field input[type=text], .field input[type=number], .field textarea, .field select{
  width:100%;
  border:none;
  border-bottom:1px solid var(--line);
  background:transparent;
  padding:8px 2px;
  font-family:'Source Serif 4', serif;
  font-size:15px;
  color:var(--ink);
}
.field input:focus, .field textarea:focus, .field select:focus{border-bottom-color:var(--burgundy);}
.field textarea{resize:vertical; min-height:60px; line-height:1.5;}
.field-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px;}
.title-input{font-family:'Fraunces', serif; font-size:24px !important; font-weight:600;}

.photo-editor{
  border:1px dashed var(--line);
  border-radius:var(--radius);
  padding:14px;
  display:flex;
  align-items:center;
  gap:16px;
}
.photo-editor .preview{
  width:96px;
  height:96px;
  object-fit:cover;
  border:1px solid var(--line);
  flex-shrink:0;
  display:block;
}
.photo-editor .placeholder{
  width:96px;
  height:96px;
  border:1px solid var(--line);
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--stone);
  font-size:11px;
  text-align:center;
  padding:4px;
}
.photo-editor .photo-actions{display:flex; gap:8px; flex-wrap:wrap;}

.star-picker{display:flex; gap:6px;}
.star-picker button{
  background:none; border:none; cursor:pointer;
  font-size:22px; color:var(--line); line-height:1; padding:0;
}
.star-picker button.on{color:var(--brass);}

.dyn-list{list-style:none; margin:0; padding:0;}
.dyn-list li{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
.dyn-list input{
  flex:1;
  border:none;
  border-bottom:1px solid var(--line);
  background:transparent;
  padding:7px 2px;
  font-family:'Source Serif 4', serif;
  font-size:14px;
  color:var(--ink);
}
.dyn-list input:focus{border-bottom-color:var(--burgundy);}
.step-row{align-items:flex-start !important;}
.step-row .step-num{margin-top:9px;}
.step-photo-slot{flex-shrink:0; display:flex; align-items:center; gap:4px;}
.step-thumb{width:40px; height:40px; object-fit:cover; border:1px solid var(--line); display:block;}
.photo-add-btn{
  width:40px; height:40px;
  border:1px dashed var(--line);
  background:none;
  color:var(--stone);
  cursor:pointer;
  font-size:15px;
  border-radius:var(--radius);
  flex-shrink:0;
}
.photo-add-btn:hover{border-color:var(--burgundy); color:var(--burgundy);}
.step-num{
  font-family:'Fraunces', serif;
  font-style:italic;
  color:var(--brass);
  width:18px;
  flex-shrink:0;
  text-align:right;
  font-size:14px;
}
.row-remove{
  background:none; border:none; color:var(--stone); cursor:pointer;
  font-size:16px; line-height:1; padding:2px 4px;
}
.row-remove:hover{color:var(--burgundy);}
.add-row-btn{
  background:none;
  border:1px dashed var(--line);
  color:var(--stone);
  font-size:12.5px;
  padding:8px 12px;
  cursor:pointer;
  width:100%;
  text-align:left;
  border-radius:var(--radius);
  font-family:'Source Serif 4', serif;
  margin-top:2px;
}
.add-row-btn:hover{border-color:var(--burgundy); color:var(--burgundy);}

.form-actions{
  display:flex;
  gap:10px;
  margin-top:32px;
  padding-top:22px;
  border-top:1px solid var(--line);
}

.toast{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  background:var(--ink);
  color:#fdf8ef;
  padding:10px 18px;
  font-size:12.5px;
  border-radius:var(--radius);
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease, transform .25s ease;
  z-index:999;
  font-family:'Source Serif 4', serif;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

.loading-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:10px;
  color:var(--stone);
  font-size:13px;
}

#export-sandbox{
  position:absolute;
  left:-9999px;
  top:0;
  width:800px;
  background:var(--paper);
  padding:40px;
}

.modal-backdrop{
  position:fixed; inset:0;
  background:rgba(28,24,20,0.5);
  display:flex; align-items:center; justify-content:center;
  z-index:1000; padding:20px;
}
.modal-box{
  background:var(--card);
  border:1px solid var(--line);
  padding:28px 26px;
  max-width:380px;
  width:100%;
}
.modal-box h3{font-size:19px; margin-bottom:10px;}
.modal-box p{font-size:13.5px; color:var(--ink-soft); margin:0 0 18px; line-height:1.5;}
.modal-box input[type=text]{
  width:100%;
  border:none;
  border-bottom:1px solid var(--line);
  background:transparent;
  padding:8px 2px;
  font-family:'Source Serif 4', serif;
  font-size:15px;
  color:var(--ink);
  margin-bottom:22px;
}
.modal-box input[type=text]:focus{border-bottom-color:var(--burgundy);}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;}

@media (max-width: 860px){
  .app{flex-direction:column;}
  .sidebar{
    width:100%;
    height:auto;
    position:relative;
    border-right:none;
    border-bottom:1px solid var(--line);
    padding:18px 18px 14px;
  }
  .main{padding:24px 18px 60px;}
  .recipe-card{padding:32px 22px;}
  .rc-body{grid-template-columns:1fr; gap:26px;}
  .field-row{grid-template-columns:1fr;}
  .cat-list{display:flex; flex-wrap:wrap; gap:4px;}
  .cat-item{flex-shrink:0;}
}
</style>
</head>
<body>
<div id="app"><div class="loading-screen">Setting the table…</div></div>
<div id="export-sandbox"></div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "carte-recipes-db-v1";
  var pendingStepPhotoIdx = null;
  var state = {
    recipes: [],
    categories: [],
    view: "list",        // list | detail | edit
    activeId: null,
    activeCategory: "All",
    search: "",
    draft: null,
    storageOk: true,
    storageMode: "idb"
  };

  function uid(){ return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function seedData(){
    return {
      recipes: [
        {
          id: uid(),
          title: "Roasted Beet Carpaccio",
          category: "Starters",
          description: "Whipped goat cheese, candied walnuts, sherry reduction",
          servings: "4",
          time: "35 min",
          difficulty: 2,
          ingredients: [
            "4 medium beets, mixed colors",
            "200g soft goat cheese",
            "60ml heavy cream",
            "60g walnuts",
            "30g sugar",
            "60ml sherry vinegar",
            "Flaky sea salt",
            "Chervil, to finish"
          ],
          steps: [
            "Roast beets whole at 200°C for 45 minutes until tender; cool, peel, and slice paper-thin on a mandoline.",
            "Whip goat cheese with cream and a pinch of salt until light and spreadable.",
            "Candy the walnuts in sugar and a splash of water over medium heat until glossy; cool on parchment.",
            "Reduce sherry vinegar by half until syrupy.",
            "Arrange beet slices on chilled plates, dot with whipped cheese, scatter walnuts, drizzle with reduction, and finish with chervil and flaky salt."
          ],
          notes: "Best served on a chilled plate — the beets should still hold a faint warmth from roasting.",
          tags: ["vegetarian", "make-ahead"],
          photo: null
        },
        {
          id: uid(),
          title: "Pan-Seared Duck Breast",
          category: "Mains",
          description: "Cherry gastrique, charred endive, potato fondant",
          servings: "2",
          time: "50 min",
          difficulty: 3,
          ingredients: [
            "2 duck breasts, skin on",
            "200g cherries, pitted",
            "40ml red wine vinegar",
            "30g sugar",
            "2 heads Belgian endive",
            "2 large potatoes",
            "50g butter",
            "200ml chicken stock",
            "Thyme, salt, pepper"
          ],
          steps: [
            "Score duck skin in a crosshatch, season generously, and rest at room temperature for 20 minutes.",
            "Cut potatoes into cylinders, sear in butter, then braise in stock with thyme until tender and glazed.",
            "Sear duck skin-side down in a cold pan, rendering fat slowly over 10–12 minutes until deeply golden; flip and cook 3 minutes more. Rest 8 minutes before slicing.",
            "Halve endive and char cut-side down in the duck fat.",
            "For the gastrique, caramelize sugar, deglaze with vinegar, and simmer with cherries until syrupy.",
            "Plate potato fondant and endive, fan the sliced duck alongside, and spoon over the cherry gastrique."
          ],

  /* ---- Custom modals (native prompt/confirm can be blocked in sandboxed previews) ---- */
  function closeModal(){
    var root = document.getElementById("modal-root");
    if(root) root.innerHTML = "";

  function modalEscHandler(e){ if(e.key === "Escape") closeModal(); }
  function openModal(innerHtml){
    var root = document.getElementById("modal-root");
    root.innerHTML = '<div class="modal-backdrop">' + innerHtml + '</div>';
    root.querySelector(".modal-backdrop").addEventListener("click", function(e){

  function showPromptModal(opts){

    html += '<div class="modal-actions"><button class="tbtn" id="modal-cancel">Cancel</button><button class="tbtn primary" id="modal-confirm">' + esc(opts.confirmLabel || "Save") + '</button></div></div>';
    var root = openModal(html);

    input.focus(); input.select();
    function doConfirm(){ var val = input.value; closeModal(); opts.onConfirm(val); }
    input.addEventListener("keydown", function(e){ if(e.key === "Enter") doConfirm(); });
    root.querySelector("#modal-confirm").addEventListener("click", doConfirm);
    root.querySelector("#modal-cancel").addEventListener("click", closeModal);
  }

  /* ---- Storage: IndexedDB (handles photo-sized data) with localStorage fallback/migration ---- */
  var DB_NAME = "carte-db", DB_STORE = "kv";
  function openDB(){
    return new Promise(function(resolve, reject){
      if(!window.indexedDB){ reject(new Error("no idb")); return; }
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
      };
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function idbGet(key){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, "readonly");
        var req = tx.objectStore(DB_STORE).get(key);
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function idbSet(key, value){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(DB_STORE, "readwrite");
        var req = tx.objectStore(DB_STORE).put(value, key);
        req.onsuccess = function(){ resolve(true); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }

  function persist(){
    var payload = {recipes: state.recipes, categories: state.categories};
    if(state.storageMode === "idb"){
      idbSet(STORAGE_KEY, payload).then(function(){ state.storageOk = true; }).catch(function(){
        state.storageOk = false;
        toast("Couldn't save — your browser's storage may be full or disabled");
      });
    } else {
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        state.storageOk = true;
      }catch(e){
        state.storageOk = false;
        toast("Couldn't save — photos make libraries large; try removing one or clearing space");
      }
    }
  }

  function init(){
    idbGet(STORAGE_KEY).then(function(data){
      state.storageMode = "idb";
      if(data){
        state.recipes = data.recipes || [];
        state.categories = data.categories || [];
        state.storageOk = true;
        render();
        return;
      }
      // nothing in idb yet — check for data from an earlier version stored in localStorage
      var raw = null;
      try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){}
      if(raw){
        try{
          var parsed = JSON.parse(raw);
          state.recipes = parsed.recipes || [];
          state.categories = parsed.categories || [];
          state.storageOk = true;
          persist();
          render();
          return;
        }catch(e){}
      }
      var seeded = seedData();
      state.recipes = seeded.recipes;
      state.categories = seeded.categories;
      state.storageOk = true;
      persist();
      render();
    }).catch(function(){
      // IndexedDB unavailable — fall back to localStorage (photos will be size-limited)
      state.storageMode = "localStorage";
      try{
        var raw2 = localStorage.getItem(STORAGE_KEY);
        if(raw2){
          var data2 = JSON.parse(raw2);
          state.recipes = data2.recipes || [];
          state.categories = data2.categories || [];
        } else {
          var seeded2 = seedData();
          state.recipes = seeded2.recipes;
          state.categories = seeded2.categories;
          persist();
        }
        state.storageOk = true;
      }catch(e){
        var seeded3 = seedData();
        state.recipes = seeded3.recipes;
        state.categories = seeded3.categories;
        state.storageOk = false;
      }
      render();
    });
  }

  function esc(s){
    return (s || "").replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function starsHtml(n, max){
    max = max || 3;
    var out = "";
    for(var i=1;i<=max;i++){ out += i<=n ? "★" : "☆"; }

  function normalizeStep(s){
    if(typeof s === "string") return {text: s, photo: null};
    return {text: (s && s.text) || "", photo: (s && s.photo) || null};
  }

  function loadAndResizeImage(file, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxDim = 1400;
        var w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = function(){ toast("Couldn't read that image"); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ toast("Couldn't read that image"); };
    reader.readAsDataURL(file);
  }

  /* ---------------- Export ---------------- */

  function downloadBlob(content, filename, mime){
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  function slug(s){ return (s||"recipe").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "recipe"; }

  function withSandbox(recipe, cb){
    var box = document.getElementById("export-sandbox");
    box.innerHTML = '<div class="recipe-card" id="sandbox-card">' + recipeCardInner(recipe) + '</div>';
    var imgs = Array.prototype.slice.call(box.querySelectorAll("img"));
    var pending = imgs.filter(function(img){ return !img.complete; });
    function finish(){
      setTimeout(function(){
        cb(box);
        box.innerHTML = "";
      }, 40);
    }
    if(pending.length === 0){ finish(); return; }
    var remaining = pending.length;
    pending.forEach(function(img){
      function done(){ remaining--; if(remaining <= 0) finish(); }
      img.addEventListener("load", done, {once: true});
      img.addEventListener("error", done, {once: true});
    });
  }

  function exportPng(recipe){
    toast("Preparing image…");
    withSandbox(recipe, function(box){
      html2canvas(box, {backgroundColor: "#f3ede1", scale: 2, useCORS: true}).then(function(canvas){
        var url = canvas.toDataURL("image/png");
        var a = document.createElement("a");
        a.href = url; a.download = slug(recipe.title) + ".png";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        toast("PNG downloaded");
      }).catch(function(){ toast("Couldn't export PNG"); });
    });
  }

  function exportPdf(recipe){
    toast("Preparing PDF…");
    withSandbox(recipe, function(box){
      html2canvas(box, {backgroundColor: "#f3ede1", scale: 2, useCORS: true}).then(function(canvas){
        var imgData = canvas.toDataURL("image/png");
        var jsPDF = window.jspdf.jsPDF;
        var pxToPt = 0.75;
        var w = canvas.width * pxToPt / 2;
        var h = canvas.height * pxToPt / 2;
        var pdf = new jsPDF({orientation: w > h ? "landscape" : "portrait", unit: "pt", format: [w, h]});
        pdf.addImage(imgData, "PNG", 0, 0, w, h);
        pdf.save(slug(recipe.title) + ".pdf");
        toast("PDF downloaded");
      }).catch(function(){ toast("Couldn't export PDF"); });
    });
  }

  function exportText(recipe){
    var lines = [];
    lines.push(recipe.title || "Untitled");
    lines.push("=".repeat((recipe.title||"Untitled").length));
    lines.push("");
    if(recipe.category) lines.push("Category: " + recipe.category);
    if(recipe.servings) lines.push("Servings: " + recipe.servings);
    if(recipe.time) lines.push("Time: " + recipe.time);
    if(recipe.difficulty) lines.push("Rating: " + starsHtml(recipe.difficulty));
    if(recipe.description){ lines.push(""); lines.push(recipe.description); }
    lines.push("");
    lines.push("INGREDIENTS");
    (recipe.ingredients||[]).forEach(function(i){ if(i && i.trim()) lines.push("- " + i); });
    lines.push("");
    lines.push("METHOD");
    (recipe.steps||[]).forEach(function(rawStep, idx){
      var s = normalizeStep(rawStep);
      if(s.text && s.text.trim()) lines.push((idx+1) + ". " + s.text + (s.photo ? "  [photo attached]" : ""));
    });
    if(recipe.notes){ lines.push(""); lines.push("Note: " + recipe.notes); }
    if(recipe.tags && recipe.tags.length){ lines.push(""); lines.push("Tags: " + recipe.tags.join(", ")); }
    downloadBlob(lines.join("\n"), slug(recipe.title) + ".txt", "text/plain");
    toast("Text file downloaded");
  }

  /* ---------------- Event handling ---------------- */

  var delegatedBound = false;

  function bindGlobalEvents(){
    var app = document.getElementById("app");
    var searchInput = document.getElementById("search-input");
    if(searchInput){
      searchInput.addEventListener("input", function(e){
        state.search = e.target.value;
        var pos = e.target.selectionStart;
        renderApp();
        var ni = document.getElementById("search-input");
        if(ni){ ni.focus(); ni.setSelectionRange(pos,pos); }
      });
    }

    var newCatInput = document.getElementById("new-cat-input");

    if(delegatedBound){ bindPerRenderListeners(newCatInput); return; }
    delegatedBound = true;

    app.addEventListener("click", function(e){
      var el = e.target.closest("[data-action]");
      if(!el) return;
      var action = el.getAttribute("data-action");

      if(action === "filter-cat"){
        state.activeCategory = el.getAttribute("data-cat");
        renderApp();
      } else if(action === "rename-cat"){
        var oldCat = el.getAttribute("data-cat");
        showPromptModal({
          title: "Rename category",
          value: oldCat,
          placeholder: "Category name",
          confirmLabel: "Rename",
          onConfirm: function(newCatRaw){
            var newCat = (newCatRaw || "").trim();
            if(newCat && newCat !== oldCat){
              state.recipes.forEach(function(r){ if(r.category === oldCat) r.category = newCat; });
              state.categories = state.categories.map(function(c){ return c === oldCat ? newCat : c; });
              state.categories = state.categories.filter(function(c, i){ return state.categories.indexOf(c) === i; });
              if(state.activeCategory === oldCat) state.activeCategory = newCat;
              persist();
              renderApp();
              toast("Category renamed");
            }
          }
        });
      } else if(action === "delete-cat"){
        var delCat = el.getAttribute("data-cat");
        var affected = countFor(delCat);
        showConfirmModal({
          title: 'Delete "' + delCat + '"?',
          message: affected > 0 ? (affected + ' recipe(s) in it will move to "Uncategorized".') : "",
          confirmLabel: "Delete",
          danger: true,
          onConfirm: function(){
            state.recipes.forEach(function(r){ if(r.category === delCat) r.category = "Uncategorized"; });
            state.categories = state.categories.filter(function(c){ return c !== delCat; });
            if(state.activeCategory === delCat) state.activeCategory = "All";
            persist();
            renderApp();
            toast("Category deleted");
          }
        });
      } else if(action === "open-recipe"){
        state.activeId = el.getAttribute("data-id");
        state.view = "detail";
        renderApp();
        window.scrollTo(0,0);
      } else if(action === "back-to-list"){
        state.view = "list";
        renderApp();
      } else if(action === "new-recipe"){
        state.draft = newDraft();
        state.view = "edit";
        renderApp();
        window.scrollTo(0,0);
      } else if(action === "edit-recipe"){
        var r = findRecipe(state.activeId);
        if(r){
          state.draft = JSON.parse(JSON.stringify(r));
          if(!state.draft.ingredients || !state.draft.ingredients.length) state.draft.ingredients = [""];
          state.draft.steps = (state.draft.steps && state.draft.steps.length) ? state.draft.steps.map(normalizeStep) : [{text:"", photo:null}];
          state.view = "edit";
          renderApp();
          window.scrollTo(0,0);
        }
      } else if(action === "cancel-edit"){
        state.draft = null;
        state.view = state.activeId ? "detail" : "list";
        renderApp();
      } else if(action === "save-recipe"){
        saveDraft();
      } else if(action === "delete-recipe"){
        var target = findRecipe(state.activeId);
        if(target){
          showConfirmModal({
            title: 'Delete "' + target.title + '"?',
            message: "This cannot be undone.",
            confirmLabel: "Delete",
            danger: true,
            onConfirm: function(){
              state.recipes = state.recipes.filter(function(r){ return r.id !== target.id; });
              state.view = "list";
              state.activeId = null;
              persist();
              renderApp();
              toast("Recipe deleted");
            }
          });
        }
      } else if(action === "duplicate-recipe"){
        var orig = findRecipe(state.activeId);
        if(orig){
          var copy = JSON.parse(JSON.stringify(orig));
          copy.id = uid();
          copy.title = copy.title + " (Copy)";
          state.recipes.push(copy);
          state.activeId = copy.id;
          persist();
          renderApp();
          toast("Recipe duplicated");
        }
      } else if(action === "export-pdf"){
        var rp = findRecipe(state.activeId); if(rp) exportPdf(rp);
      } else if(action === "export-png"){
        var rn = findRecipe(state.activeId); if(rn) exportPng(rn);
      } else if(action === "export-text"){
        var rt = findRecipe(state.activeId); if(rt) exportText(rt);
      } else if(action === "add-cat"){
        addCategory();
      } else if(action === "add-ing"){
        state.draft.ingredients.push("");
        refreshIngEditor();
      } else if(action === "remove-ing"){
        var iidx = parseInt(el.getAttribute("data-idx"),10);
        state.draft.ingredients.splice(iidx,1);
        if(state.draft.ingredients.length===0) state.draft.ingredients.push("");
        refreshIngEditor();
      } else if(action === "add-step"){
        state.draft.steps.push({text:"", photo:null});
        refreshStepEditor();
      } else if(action === "remove-step"){
        var sidx = parseInt(el.getAttribute("data-idx"),10);
        state.draft.steps.splice(sidx,1);
        if(state.draft.steps.length===0) state.draft.steps.push({text:"", photo:null});
        refreshStepEditor();
      } else if(action === "add-step-photo"){
        pendingStepPhotoIdx = parseInt(el.getAttribute("data-idx"),10);
        document.getElementById("f-step-photo-file").click();
      } else if(action === "remove-step-photo"){
        var rpidx = parseInt(el.getAttribute("data-idx"),10);
        state.draft.steps[rpidx].photo = null;
        refreshStepEditor();
      } else if(action === "add-photo"){
        document.getElementById("f-photo-file").click();
      } else if(action === "remove-photo"){
        state.draft.photo = null;
        refreshPhotoEditor();
      } else if(action === "export-json"){
        downloadBlob(JSON.stringify({recipes: state.recipes, categories: state.categories}, null, 2), "carte-library.json", "application/json");
        toast("Library exported");
      } else if(action === "import-json"){
        document.getElementById("import-file").click();
      }

      var star = e.target.closest("#f-difficulty button");
      if(star){
        state.draft.difficulty = parseInt(star.getAttribute("data-val"),10);
        document.querySelectorAll("#f-difficulty button").forEach(function(b){
          b.classList.toggle("on", parseInt(b.getAttribute("data-val"),10) <= state.draft.difficulty);
        });
      }
    });

    app.addEventListener("input", function(e){
      var t = e.target;
      if(t.id === "f-title") state.draft.title = t.value;
      else if(t.id === "f-category") state.draft.category = t.value;
      else if(t.id === "f-servings") state.draft.servings = t.value;
      else if(t.id === "f-time") state.draft.time = t.value;
      else if(t.id === "f-description") state.draft.description = t.value;
      else if(t.id === "f-notes") state.draft.notes = t.value;
      else if(t.id === "f-tags") state.draft.tags = t.value.split(",").map(function(s){return s.trim();}).filter(Boolean);
      else if(t.classList.contains("ing-input")) state.draft.ingredients[parseInt(t.getAttribute("data-idx"),10)] = t.value;
      else if(t.classList.contains("step-input")) state.draft.steps[parseInt(t.getAttribute("data-idx"),10)].text = t.value;
    });

    bindPerRenderListeners(newCatInput);
  }

  function bindPerRenderListeners(newCatInput){
    var photoFile = document.getElementById("f-photo-file");
    if(photoFile){
      photoFile.addEventListener("change", function(e){
        var file = e.target.files[0];
        if(!file) return;
        if(!file.type || file.type.indexOf("image/") !== 0){ toast("Please choose an image file"); return; }
        toast("Processing photo…");
        loadAndResizeImage(file, function(dataUrl){
          state.draft.photo = dataUrl;
          refreshPhotoEditor();
          toast("Photo added");
        });
        e.target.value = "";
      });
    }

    var stepPhotoFile = document.getElementById("f-step-photo-file");
    if(stepPhotoFile){
      stepPhotoFile.addEventListener("change", function(e){
        var file = e.target.files[0];
        if(!file || pendingStepPhotoIdx === null) return;
        if(!file.type || file.type.indexOf("image/") !== 0){ toast("Please choose an image file"); return; }
        var idx = pendingStepPhotoIdx;
        toast("Processing photo…");
        loadAndResizeImage(file, function(dataUrl){
          state.draft.steps[idx].photo = dataUrl;
          refreshStepEditor();
          toast("Photo added");
        });
        e.target.value = "";
        pendingStepPhotoIdx = null;
      });
    }

    var importFile = document.getElementById("import-file");
    if(importFile){
      importFile.addEventListener("change", function(e){
        var file = e.target.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(evt){
          try{
            var data = JSON.parse(evt.target.result);
            if(!data.recipes) throw new Error("bad format");
            showChoiceModal({
              title: "Import library",
              message: "Merge this file with your existing recipes, or replace your library entirely?",
              choices: [
                {label: "Cancel", value: "cancel"},
                {label: "Replace", value: "replace", danger: true},
                {label: "Merge", value: "merge", primary: true}
              ],
              onChoose: function(choice){
                if(choice === "merge"){
                  var existingIds = {};
                  state.recipes.forEach(function(r){ existingIds[r.id] = true; });
                  data.recipes.forEach(function(r){ if(existingIds[r.id]) r.id = uid(); state.recipes.push(r); });
                  (data.categories||[]).forEach(function(c){ if(state.categories.indexOf(c)===-1) state.categories.push(c); });
                } else if(choice === "replace"){
                  state.recipes = data.recipes;
                  state.categories = data.categories || [];
                }
                persist();
                state.view = "list";
                renderApp();
                toast("Library imported");
              }
            });
          }catch(err){
            toast("Couldn't read that file");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      });
    }

    if(newCatInput){
      newCatInput.addEventListener("keydown", function(e){
        if(e.key === "Enter"){ addCategory(); }
      });
    }
  }

  function addCategory(){
    var input = document.getElementById("new-cat-input");
    var val = input.value.trim();
    if(!val) return;
    if(state.categories.indexOf(val) === -1){
      state.categories.push(val);
      persist();
    }
    state.activeCategory = val;
    renderApp();
  }

  function saveDraft(){
    var d = state.draft;
    if(!d.title || !d.title.trim()){
      toast("Give the recipe a title first");
      return;
    }
    d.title = d.title.trim();
    d.category = (d.category || "Uncategorized").trim() || "Uncategorized";
    d.ingredients = d.ingredients.filter(function(i){ return i && i.trim(); });
    d.steps = d.steps.filter(function(s){ return s && s.text && s.text.trim(); });
    if(d.ingredients.length===0) d.ingredients = [""];
    if(d.steps.length===0) d.steps = [{text:"", photo:null}];

    var existingIdx = -1;
    for(var i=0;i<state.recipes.length;i++){ if(state.recipes[i].id === d.id) existingIdx = i; }
    delete d._isNew;
    if(existingIdx >= 0){ state.recipes[existingIdx] = d; }
    else { state.recipes.push(d); }

    if(state.categories.indexOf(d.category) === -1) state.categories.push(d.category);

    state.activeId = d.id;
    state.draft = null;
    state.view = "detail";
    persist();
    renderApp();
    toast("Recipe saved");
  }

  init();
})();
</script>
</body>
</html>
